services:
  mongodb:
    image: mongo:8.0
    container_name: fundsprojects-aim-mongodb
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-aim_admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-aim_local_dev_change_me}
    volumes:
      - fundsprojects_aim_mongodb_data:/data/db
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet --username $$MONGO_INITDB_ROOT_USERNAME --password $$MONGO_INITDB_ROOT_PASSWORD --authenticationDatabase admin --eval 'db.adminCommand({ ping: 1 }).ok' | grep 1"
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  mailpit:
    image: ghcr.io/axllent/mailpit:v1.30.6
    container_name: fundsprojects-aim-mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    environment:
      MP_MAX_MESSAGES: 500
      MP_DATABASE: /data/mailpit.db
    volumes:
      - fundsprojects_aim_mailpit_data:/data

volumes:
  fundsprojects_aim_mongodb_data:
    name: fundsprojects_aim_mongodb_data
  fundsprojects_aim_mailpit_data:
    name: fundsprojects_aim_mailpit_data
